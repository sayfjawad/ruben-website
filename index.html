<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kanhai.it</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(1200px 600px at 50% -10%, #6366f1 0%, #0b1020 55%);
        color: #e7e9f3;
      }
      .card {
        max-width: 640px; margin: 2rem; padding: 2.5rem;
        background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
        border-radius: 20px; backdrop-filter: blur(8px);
        box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      }
      h1 { margin: 0 0 .25rem; font-size: 2rem; }
      .badge { display:inline-block; font-size:.8rem; padding:.2rem .6rem;
        background:#6366f1; border-radius:999px; margin-bottom:1rem; }
      p { line-height: 1.6; opacity: .9; }
      code { background: rgba(0,0,0,.35); padding: .15rem .4rem; border-radius: 6px; font-size:.9em; }
      .cta { display:inline-block; margin-top:.4rem; padding:.6rem 1rem; border-radius:12px;
        background:#6366f1; color:#fff !important; text-decoration:none; font-weight:600; font-size:.95rem; }
      .cta:hover { background:#4f46e5; }
      .cards { display:flex; flex-wrap:wrap; gap:.6rem; margin-top:1.4rem; }
      .cards a { flex:1 1 140px; padding:.7rem .9rem; border-radius:12px;
        background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
        text-decoration:none; font-size:.9rem; }
      .cards a:hover { background:rgba(255,255,255,.12); }
      a { color: #a5b4fc; }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">kanhai.it</span>
      <h1>Welkom bij kanhai.it 👋</h1>
      <p>
        Deze site draait vanuit <code>/workspace/ruben-website</code> op poort
        <code>3000</code> en wordt geserveerd op
        <a href="https://ruben.sdai.nl">ruben.sdai.nl</a>.
      </p>
      <p>
        <a class="cta" href="/chat.html">💬 Chat met ons eigen Qwen-model →</a>
      </p>
      <div class="cards">
        <a href="/chat.html">Chatbot →</a>
        <a href="https://github.com/sayfjawad/ruben-website">Code op GitHub →</a>
      </div>
    </main>
  </body>
</html>
